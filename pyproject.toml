[project]
name = "vdi"
version = "0.1.0"
description = "Sistema multiagente (CrewAI) para el diseño conceptual de sistemas mecatrónicos según la VDI/VDE 2206"
authors = [{ name = "Andrés Arteaga" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.17,<2.0.0",
    "httpx",          # interceptor que registra cada respuesta del modelo (registro_llm.py)
    "numpy",          # busqueda vectorial del RAG
    "pint>=0.24.4",   # unidades del modelo de diseno compartido (modelo.py)
    "pymupdf",        # lectura de los manuales en PDF del RAG
    "python-dotenv",  # TAVILY_API_KEY desde el archivo .env
    "rdflib>=7.6.0",  # exportacion del modelo de diseno a RDF (Turtle)
]

[project.scripts]
kickoff = "vdi.main:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
