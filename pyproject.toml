[project]
name = "vdi"
version = "0.1.0"
description = "VDI using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.17,<2.0.0"
]

[project.scripts]
kickoff = "vdi.main:kickoff"
run_crew = "vdi.main:kickoff"
plot = "vdi.main:plot"
run_with_trigger = "vdi.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "96075bb9-e299-4e91-acf4-09b7677fc4cf"
