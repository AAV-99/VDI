requirements_ingestion_task:
  description: >
    Analizar el tipo de proyecto {system_type}, el alcance general {project_scope} y los requerimientos
    principales {primary_requirements}. Establecer los límites del sistema mecatrónico o IoT bajo la
    metodología VDI 2206 y formular la matriz inicial de requerimientos funcionales y restricciones.
  expected_output: >
    Un informe de arquitectura de sistema con la matriz de requerimientos funcionales, restricciones
    operativas y la delimitación conceptual del proyecto.
  agent: team_lead
  output_file: output/01_requirements_and_system.md

mechanical_subsystem_design_task:
  description: >
    Desarrollar la propuesta conceptual del subsistema mecánico, estructural o de envolvente para {system_type}.
    Explicar los conceptos mecánicos adoptados para cumplir con {project_scope}, detallando qué mecanismos,
    sistemas de sujeción, transmisión o disipación se utilizarán. Generar una tabla de BOM Preliminar Mecánico
    especificando materiales (aleaciones, polímeros, compuestos) y componentes comerciales principales.
  expected_output: >
    Un reporte técnico del subsistema mecánico que desglose la justificación conceptual de la estructura/mecanismos
    y presente una tabla BOM preliminar de materiales y componentes.
  agent: mecanico
  output_file: output/02_mechanical_subsystem.md

electronic_subsystem_design_task:
  description: >
    Desarrollar la propuesta conceptual del subsistema electrónico, hardware y control para {system_type}.
    Explicar la arquitectura de instrumentación, sensores, actuadores, etapas de potencia y comunicación
    para responder a {primary_requirements}. Construir una tabla de BOM Preliminar Electrónico de componentes comerciales.
  expected_output: >
    Un reporte técnico del subsistema electrónico con el esquema conceptual de hardware/control y la tabla
    BOM preliminar de componentes electrónicos.
  agent: electronico
  output_file: output/03_electronic_subsystem.md

software_subsystem_design_task:
  description: >
    Desarrollar la propuesta conceptual de la arquitectura de software o firmware para {system_type}. Explicar
    la organización modular (procesamiento en el borde, tiempo real, capas de red, HMI/Cloud según aplique)
    necesaria para {primary_requirements}. Proponer el stack de tecnologías, plataformas y herramientas sugeridas.
    NO INCLUIR NINGÚN BLOQUE DE CÓDIGO.
  expected_output: >
    Un documento conceptual de arquitectura de software/firmware que describa los módulos del sistema y las
    tecnologías propuestas, redactado exclusivamente en prosa técnica sin código.
  agent: software
  output_file: output/04_software_architecture.md

maintenance_rams_eval_task:
  description: >
    Evaluar Confiabilidad, Disponibilidad, Mantenibilidad y Seguridad (RAMS) para {system_type} en el marco de
    {project_scope}. Definir la modularidad para reemplazo rápido de piezas y proponer la estrategia de
    diagnóstico o monitoreo de condición (PHM).
  expected_output: >
    Un reporte RAMS con métricas estimadas y la arquitectura propuesta para el mantenimiento y diagnóstico del sistema.
  agent: mantenimiento
  output_file: output/05_rams_maintenance.md

client_acceptance_review_task:
  description: >
    Revisar de forma integral las propuestas técnicas entregadas para {system_type} asegurando el cumplimiento
    de {primary_requirements}. Emitir el dictamen de validación, observaciones de usabilidad y solicitudes de cambio.
  expected_output: >
    Un reporte de evaluación del cliente con la matriz de revisión, observaciones técnicas y criterios de aceptación.
  agent: cliente
  output_file: output/06_client_acceptance.md

design_board_integration_task:
  description: >
    Sintetizar y consolidar las entregas de todas las disciplinas en el Dossier de Diseño Conceptual VDI 2206
    final para {system_type}. Resolver conflictos entre dominios y calcular la puntuación ponderada global del diseño.
  expected_output: >
    El expediente final consolidado (Conceptual Design Dossier) en formato Markdown según la norma VDI 2206.
  agent: team_lead
  output_file: output/00_vdi2206_consolidated_dossier.md