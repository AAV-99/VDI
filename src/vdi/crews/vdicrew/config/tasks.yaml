requirements_ingestion_task:
  description: >
    Analizar el tipo de proyecto {system_type}, el alcance general {project_scope}, los requerimientos
    principales {primary_requirements} y el presupuesto {target_cost}. Establecer los límites del sistema mecatrónico o IoT bajo la
    metodología VDI 2206 y desarrollar la Fase 1 (Información) siguiendo el contexto metodológico común.
    CONTENIDO OBLIGATORIO, en este orden: (1) caja negra; (2) estructura funcional inicial; (3) descomposición funcional con atributos
    y portadores de función preliminares; (4) stakeholders y sus necesidades; (5) clasificación de necesidades; (6) matriz de necesidades;
    (7) requerimientos funcionales, requerimientos no funcionales, restricciones y especificaciones, cada uno con valor, unidad, límite y
    método de verificación; (8) cuantificación de los parámetros y variables de diseño; (9) matriz QFD etapa 1 de necesidades frente a
    requerimientos, con la importancia técnica calculada; (10) benchmarking con al menos tres productos completos comparables, es decir,
    grippers o efectores finales y no componentes sueltos como eyectores o válvulas (fabricante y modelo, principio de sujeción, masa,
    carga o fuerza y URL de la fuente), y cómo fija o ajusta los valores objetivo de las especificaciones. Si no tienes la herramienta
    buscar_web, declara el benchmarking como actividad pendiente.
    [[MODELO: Registra en el modelo las necesidades, los requerimientos con su Deriva de (y la columna Limita en los requerimientos que limitan la masa total y el costo total del sistema) y las funciones de la estructura funcional, con los mismos ID del informe, y los elementos externos de la caja negra (X-xx: robot, pieza, gabinete, operador) con los datos conocidos. Solo esas clases: el sistema, los módulos, las interfaces y los parámetros se registran en la síntesis (01b).]]
    [[TABLAS:REGLA DE FORMATO: Prioriza tablas Markdown y viñetas técnicas densas. Para límites o fronteras del sistema, utiliza EXCLUSIVAMENTE diagramas en sintaxis Mermaid (```mermaid). PROHIBIDO incluir esquemas o cajas en ASCII Art.]]
    [[ANALISIS: REGLA DE FORMATO: Explica cada punto del contenido obligatorio en prosa técnica breve con los ID del modelo: las necesidades, los requerimientos, las funciones y los elementos externos salen en las tablas que el código genera. Escribe como tabla solo la matriz de necesidades, la matriz QFD etapa 1 y el benchmarking. La caja negra y la estructura funcional van en diagramas Mermaid.]]
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras. Prioriza el contenido esencial y no agregues anexos de relleno.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    [[TABLAS:Un informe de Fase 1 completo en Markdown con los nueve elementos obligatorios, identificadores trazables y la matriz QFD etapa 1,
    estructurado en capítulos técnicos sin prosa de relleno.]]
    [[ANALISIS: El análisis de la Fase 1 en Markdown con los diez puntos obligatorios, los ID del modelo, la matriz de necesidades, la
    QFD etapa 1, el benchmarking y los diagramas Mermaid, sin copiar las tablas de datos del modelo.]]
  agent: team_lead

system_synthesis_task:
  description: >
    Desarrollar la Fase 2 (Síntesis de diseño) a nivel de sistema para {system_type}, a partir del informe de requerimientos y siguiendo
    el contexto metodológico común. Esta es la etapa de diseño del sistema del modelo en V de la VDI 2206: aquí se elige el concepto y se
    reparten las funciones entre los dominios; las disciplinas lo desarrollarán después.
    CONTENIDO OBLIGATORIO, en este orden: (1) validación y reestructuración de la caja negra y la estructura funcional; (2) matriz morfológica
    con al menos tres principios de solución por subfunción; (3) rutas factibles con al menos tres conceptos diferentes y, para cada uno, un componente comercial existente
    que materialice su principio crítico, con su URL si tienes buscar_web (disponibilidad comercial); (4) evaluación de
    conceptos con pesos derivados del QFD etapa 1 y el cálculo de cada puntaje; (5) concepto seleccionado y su justificación frente a
    {primary_requirements}; (6) arquitectura del producto con módulos, asignación de subfunciones a módulos y dominios, e interfaces entre
    módulos; (7) matriz QFD etapa 2 de requerimientos frente a variables de diseño; (8) matriz de diseño axiomático con su diagnóstico de
    acoplamiento; (9) presupuestos preliminares de masa, costo y tiempo de ciclo repartidos por módulo, que las disciplinas deben respetar.
    [[MODELO: Registra en el modelo el sistema SIS con el concepto seleccionado y su principio, los módulos con sus presupuestos de masa, costo y tiempo, la columna Módulo de cada función, las interfaces entre módulos y con los elementos externos, y los parámetros de diseño del QFD etapa 2 con Mide o Contribuye a. En Dominios de cada módulo nombra todas las disciplinas que trabajan en él: incluye software en el módulo donde corre el control. Registra las decisiones del sistema: una D-xx del concepto seleccionado (Alternativas: los conceptos evaluados; Criterios: los requerimientos con más peso; Evidencia: la MAT-xx de la evaluación si la tienes; Justifica: SIS) y una de la arquitectura (Justifica: los módulos).]]
    [[TABLAS:REGLA DE FORMATO: Usa tablas Markdown para la matriz morfológica, la evaluación, el QFD y la matriz axiomática, y diagramas Mermaid (```mermaid) para la estructura funcional y la arquitectura del producto. PROHIBIDO el uso de ASCII Art.]]
    [[ANALISIS: REGLA DE FORMATO: Escribe como tabla la matriz morfológica, las rutas factibles, la evaluación de conceptos y el QFD etapa 2. El sistema, los módulos con sus presupuestos, la asignación de funciones, las interfaces, los parámetros y la matriz de diseño axiomático los genera el código desde el modelo: explica en prosa el diagnóstico de acoplamiento y el reparto de los presupuestos. La estructura funcional y la arquitectura van en diagramas Mermaid.]]
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras. Prioriza el contenido esencial y no agregues anexos de relleno.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    [[TABLAS:Un informe de síntesis del sistema en Markdown con la matriz morfológica, al menos tres conceptos evaluados, el concepto seleccionado,
    la arquitectura del producto con interfaces, las matrices QFD etapa 2 y de diseño axiomático, y los presupuestos por módulo.]]
    [[ANALISIS: El análisis de la síntesis en Markdown con la matriz morfológica, al menos tres conceptos evaluados, la justificación del
    concepto seleccionado y de la arquitectura, el QFD etapa 2 y el diagnóstico de acoplamiento, citando los ID del modelo.]]
  agent: team_lead

mechanical_subsystem_design_task:
  description: >
    Desarrollar el diseño específico del dominio mecánico, estructural o de envolvente para {system_type} según la VDI 2206.
    PUNTO DE PARTIDA: Desarrolla el concepto seleccionado en la síntesis del sistema y respeta su arquitectura, interfaces y presupuestos.
    No cambies el principio de solución; si un cálculo demuestra que no es viable en tu dominio, decláralo con ese cálculo y propone la
    alternativa de la matriz morfológica que lo resolvería.
    CONTENIDO OBLIGATORIO: (1) subfunciones y portadores de función mecánicos asignados por la arquitectura; (2) mecanismos, sujeción,
    transmisión o disipación adoptados para cumplir con {project_scope}; (3) dimensionamiento de los componentes críticos con cargas,
    materiales y factores de seguridad; (4) verificación de cada requerimiento asignado al dominio con su método; (5) interfaces mecánicas
    con los otros dominios; (6) selección de componentes comerciales en una tabla con la especificación requerida por tu cálculo, el
    modelo comercial candidato, el valor de su hoja de datos, si cumple y la fuente (URL, o Supuesto si no la tienes o no trae el valor);
    (7) BOM Preliminar Mecánico con material o referencia, cantidad, masa y costo por línea y totales que sumen. Los costos son
    estimaciones: márcalos como Supuesto e indica el criterio (precio típico del componente, o material por masa más mecanizado).
    [[MODELO: Registra en el modelo cada línea de tu BOM como componente, con Satisface y Realiza (el BOM del informe usa los mismos ID CP-xx); registra solo los componentes de tu dominio: los sensores, válvulas y el cableado los registra electrónica aunque los montes tú. Registra también los parámetros críticos de tu dimensionamiento con Mide o Contribuye a, el protocolo o los niveles de las interfaces que te tocan, y una decisión D-xx por cada elección importante de tu dominio (principio o mecanismo de un componente propio, material, componente comercial crítico), con Justifica los CP-xx y DP-xx que fija. Los totales de masa y costo los calcula el código: consúltalos con presupuestos.]]
    [[TABLAS:REGLA DE FORMATO: Representa flujos, cinemática o ensamble estructural mediante diagramas Mermaid (```mermaid). Evita descripciones narrativas largas; utiliza tablas técnicas y fórmulas explicativas directas. PROHIBIDO el uso de ASCII Art.]]
    [[ANALISIS: REGLA DE FORMATO: Explica el dimensionamiento y la verificación con fórmulas directas, citando los CAL-xx y FT-xx. Escribe como tabla solo la selección de componentes comerciales del punto 6; el BOM, sus totales, los parámetros y las interfaces los genera el código desde el modelo. Flujos, cinemática o ensamble en diagramas Mermaid.]]
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras. Prioriza el contenido esencial y no agregues anexos de relleno.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    [[TABLAS:Un reporte técnico del dominio mecánico con el dimensionamiento de componentes críticos, la verificación de los requerimientos asignados,
    las interfaces y la tabla BOM preliminar con masa y costo por línea.]]
    [[ANALISIS: El análisis del dominio mecánico en Markdown con el dimensionamiento de los componentes críticos, la verificación de los
    requerimientos asignados, las interfaces y la selección de componentes comerciales, citando los ID del modelo y sin copiar el BOM.]]
  agent: mecanico

electronic_subsystem_design_task:
  description: >
    Desarrollar el diseño específico del dominio eléctrico y electrónico (hardware, instrumentación y control) para {system_type} según la VDI 2206.
    PUNTO DE PARTIDA: Desarrolla el concepto seleccionado en la síntesis del sistema y respeta su arquitectura, interfaces y presupuestos.
    No cambies el principio de solución; si un cálculo demuestra que no es viable en tu dominio, decláralo con ese cálculo y propone la
    alternativa de la matriz morfológica que lo resolvería.
    CONTENIDO OBLIGATORIO: (1) arquitectura de instrumentación, sensores, actuadores, potencia y comunicación para responder a
    {primary_requirements}; (2) dimensionamiento de los componentes críticos, incluido el presupuesto de potencia y corriente; (3) análisis
    de integración de cada interfaz eléctrica y de señal con protocolo, niveles y compatibilidad, más la prueba de compatibilidad propuesta;
    (4) verificación de cada requerimiento asignado al dominio con su método; (5) selección de componentes comerciales en una tabla con la
    especificación requerida (por ejemplo corriente de bobina frente al límite de las salidas, tensión, tipo de salida, tiempo de respuesta),
    el modelo comercial candidato, el valor de su hoja de datos, si cumple y la fuente (URL, o Supuesto si no la tienes o no trae el valor);
    (6) BOM Preliminar Electrónico con referencia típica, cantidad, masa y costo por línea y totales que sumen. Los costos son
    estimaciones: márcalos como Supuesto e indica el criterio. No repitas en tu BOM componentes que ya estén en el BOM mecánico.
    [[MODELO: Registra en el modelo cada línea de tu BOM como componente, con Satisface y Realiza (el BOM del informe usa los mismos ID CP-xx); registra solo los componentes de tu dominio: la estructura, los soportes y la tornillería los registra mecánica. Registra también los parámetros críticos de tu dimensionamiento con Mide o Contribuye a, el protocolo o los niveles de las interfaces eléctricas y de señal, y una decisión D-xx por cada elección importante de tu dominio (sensor, actuador, fuente o protocolo), con Justifica los CP-xx y DP-xx que fija. Los totales de masa y costo los calcula el código: consúltalos con presupuestos.]]
    [[TABLAS:REGLA DE FORMATO: Todos los esquemas de bloque, arquitectura de sensores, distribución de potencia y comunicaciones DEBEN diagramarse en sintaxis Mermaid (```mermaid). No dibuches diagramas con texto plano o bordes de cajas.]]
    [[ANALISIS: REGLA DE FORMATO: Explica el dimensionamiento, el presupuesto de potencia y la integración de interfaces con fórmulas directas, citando los CAL-xx y FT-xx. Escribe como tabla solo la selección de componentes comerciales del punto 5; el BOM, sus totales, los parámetros y las interfaces los genera el código desde el modelo. Esquemas de bloques, sensores, potencia y comunicaciones en diagramas Mermaid.]]
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras. Prioriza el contenido esencial y no agregues anexos de relleno.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    [[TABLAS:Un reporte técnico del dominio eléctrico y electrónico con diagramas de bloques en Mermaid, el presupuesto de potencia, el análisis de
    integración de interfaces y la tabla BOM preliminar con masa y costo por línea.]]
    [[ANALISIS: El análisis del dominio eléctrico y electrónico en Markdown con diagramas de bloques en Mermaid, el presupuesto de potencia,
    la integración de interfaces y la selección de componentes comerciales, citando los ID del modelo y sin copiar el BOM.]]
  agent: electronico

software_subsystem_design_task:
  description: >
    Desarrollar el diseño específico del dominio de software o firmware para {system_type} según la VDI 2206.
    PUNTO DE PARTIDA: Desarrolla el concepto seleccionado en la síntesis del sistema y respeta su arquitectura, interfaces y presupuestos.
    No cambies el principio de solución; si un cálculo demuestra que no es viable en tu dominio, decláralo con ese cálculo y propone la
    alternativa de la matriz morfológica que lo resolvería.
    CONTENIDO OBLIGATORIO: (1) organización modular (procesamiento en el borde, tiempo real, capas de red, HMI o Cloud según aplique)
    necesaria para {primary_requirements}; (2) máquina de estados y lógica de control con sus tiempos; (3) análisis de integración de
    las interfaces de datos y señales con los otros dominios, con protocolo, temporización y prueba de compatibilidad propuesta;
    (4) verificación de cada requerimiento asignado al dominio con su método; (5) stack de tecnologías, plataformas y herramientas.
    [[MODELO: Registra en el modelo los parámetros de tiempos y de lógica con Mide o Contribuye a, con Elemento el módulo de software que les corresponde; el protocolo de las interfaces de datos, y componentes solo si tienen masa o costo. Registra una decisión D-xx por cada elección importante de tu dominio (plataforma, estrategia de control o protocolo), con Justifica los DP-xx que fija.]]
    REGLA DE FORMATO: Modulos, capas de firmware y máquinas de estado deben diagramarse mediante sintaxis Mermaid (```mermaid) o tablas de transición de estado. NO INCLUIR NINGÚN BLOQUE DE CÓDIGO NI ASCII ART.
    [[ANALISIS: Los parámetros de tiempos y las interfaces los genera el código desde el modelo: cítalos por su ID, no los copies en tablas.]]
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras. Prioriza el contenido esencial y no agregues anexos de relleno.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    Un documento conceptual de arquitectura de software/firmware exhaustivo que describa los módulos del sistema y las tecnologías propuestas, redactado en prosa técnica densa y diagramas Mermaid.
  agent: software

maintenance_rams_eval_task:
  description: >
    Evaluar Confiabilidad, Disponibilidad, Mantenibilidad y Seguridad (RAMS) para {system_type} en el marco de
    {project_scope}. Definir la modularidad para reemplazo rápido de piezas y proponer la estrategia de
    diagnóstico o monitoreo de condición (PHM). Para tasas de falla y vida útil usa los datos de los fabricantes de los componentes
    seleccionados (B10d, MTTF, ciclos de vida) cuando los encuentres, citando su fuente; si no, márcalos como Supuesto.
    [[MODELO: Registra en el modelo los parámetros de confiabilidad (MTTF, B10d o ciclos de vida) de los componentes críticos, con Elemento el CP-xx, su fuente y su nivel, y cada modo de falla de tu FMEA como modo_falla (MF-xx) con S, O y D de 1 a 10 y la acción recomendada: el RPN lo calcula el código.]]
    [[TABLAS:REGLA DE FORMATO: Presenta matrices de riesgo, estimaciones RAMS y estrategias PHM en tablas cuantitativas claras y diagramas de flujo en sintaxis Mermaid (```mermaid).]]
    [[ANALISIS: REGLA DE FORMATO: Explica las estimaciones RAMS con sus fórmulas, citando los CAL-xx y FT-xx. La matriz FMEA y los parámetros de confiabilidad los genera el código desde el modelo; escribe como tabla solo la estrategia PHM y el plan de mantenimiento. Flujos de diagnóstico en diagramas Mermaid.]]
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras. Prioriza el contenido esencial y no agregues anexos de relleno.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    [[TABLAS:Un reporte RAMS completo con métricas estimadas, matriz FMEA/RAMS y la arquitectura para mantenimiento y monitoreo condicional.]]
    [[ANALISIS: El análisis RAMS en Markdown con las métricas estimadas, los modos de falla registrados y la arquitectura para mantenimiento
    y monitoreo condicional, citando los ID del modelo.]]
  agent: mantenimiento

client_acceptance_review_task:
  description: >
    Revisar de forma integral las propuestas técnicas entregadas para {system_type} asegurando el cumplimiento
    de {primary_requirements} y el {target_cost}. Emitir el dictamen de validación, observaciones de usabilidad y solicitudes de cambio.
    VERIFICACIÓN METODOLÓGICA: Comprueba que cada requerimiento tenga valor medible, método de verificación y un portador de función o
    componente asignado; que el concepto seleccionado sea consistente con la evaluación de conceptos; que los diseños de dominio respeten la
    arquitectura y los presupuestos de la síntesis del sistema; que los totales de cada tabla sumen sus líneas; y que las masas y
    dimensiones sean físicamente plausibles (volumen por densidad en piezas macizas). Cada ECR debe tener un
    criterio de aceptación verificable.
    [[MODELO: Registra en el modelo cada ECR de tu informe, con el mismo ID, su Descripción, su Criterio de aceptación y Afecta (los ID de los elementos del modelo afectados). Las comprobaciones automáticas de la vista son una entrada de tu revisión: confirma cada una en los informes antes de convertirla en ECR. Agrupa en una sola ECR de trazabilidad los avisos de enlaces y portadores (K-01, K-02, K-03, K-08 y los K-06 que solo dicen que un valor usa cierto porcentaje de su requerimiento), con Afecta la lista de elementos; abre una ECR propia solo para un incumplimiento real (un K-06 que dice «no cumple», un K-05 o un K-07 confirmado en los informes).]]
    REGLA DE FORMATO: Organiza la validación en una matriz de conformidad (Tabla Markdown) evaluando cada requisito frente al costo y desempeño propuesto.
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras. Prioriza el contenido esencial y no agregues anexos de relleno.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    Un reporte de evaluación del cliente con la matriz de revisión técnico-económica, observaciones puntuales y dictamen final de aceptación.
  agent: cliente

design_board_integration_task:
  description: >
    [[TABLAS:Sintetizar y consolidar las entregas de todas las disciplinas en el Dossier de Diseño Conceptual VDI 2206
    final para {system_type}. Resolver los conflictos entre dominios, registrar el estado de cada solicitud de cambio (ECR) del cliente,
    articular la integración VDI 2206 y calcular la puntuación ponderada global del diseño, además de verificar el cumplimiento del presupuesto {target_cost}.
    REGLA DE INTEGRACIÓN: Corrige los errores e inconsistencias que encuentres y toma las decisiones de diseño necesarias para entregar un
    concepto completo y coherente. Antes de cambiar un parámetro de un subsistema (dimensiones, componentes, setpoints, tiempos), demuestra con
    un cálculo que el valor original no cumple el requisito o es inconsistente; si el valor original ya cumple, consérvalo. Registra cada cambio
    en una tabla de decisiones de integración con las columnas: parámetro, valor original y disciplina que lo propuso, valor nuevo, motivo,
    cálculo que lo justifica e impacto en masa y costo. Después de cualquier cambio, recalcula los totales afectados (BOM, masa, costo, ciclo).
    REGLA DE CIERRE DE ECR: Incluye una tabla con una fila por cada ECR del informe del cliente y las columnas: ECR, criterio de aceptación del
    cliente (citado textualmente), evidencia disponible en los informes o en tus decisiones de integración y estado. El estado solo puede ser
    Cumple, No cumple o Pendiente de prueba. Usa Cumple únicamente si la evidencia o el cálculo presentado satisface el criterio citado. Todo criterio que requiera medición, ensayo,
    prototipo, simulación o cotización que no se haya hecho es Pendiente de prueba. No afirmes análisis, pruebas ni cotizaciones que no se realizaron.
    El estado final del dossier debe ser coherente con esa tabla: si alguna ECR queda en No cumple o Pendiente de prueba, el diseño no puede declararse aprobado sin condiciones.
    COMPONENTES A COTIZAR: Incluye una tabla con los componentes comerciales del BOM final y las columnas: componente, especificación
    mínima, referencia candidata y precio estimado. Los precios del BOM son estimaciones; la cotización formal es una tarea pendiente del
    diseñador, y el cumplimiento de {target_cost} se declara verificado contra estimaciones.
    CICLO DE CORRECCIÓN: Si el contexto incluye el historial del ciclo de corrección, las disciplinas ya corrigieron sus informes
    para atender las ECR y el cliente verificó esas correcciones. En ese caso trabaja sobre las versiones más recientes de cada informe y
    estas reglas prevalecen sobre la REGLA DE INTEGRACIÓN: solo puedes cambiar parámetros para resolver conflictos entre dominios (dos
    informes con valores distintos para el mismo parámetro), los presupuestos de sistema (BOM, masa, costo, ciclo) y las ECR escaladas o
    de nivel sistema que indique el historial. No cambies parámetros para cerrar ninguna otra ECR. En la tabla de cierre copia, sin
    modificarlo, el estado de cada ECR en la última verificación del cliente en que aparece (las cerradas en iteraciones anteriores
    figuran en el historial), con dos excepciones: una ECR que el cliente abrió y que el ciclo no alcanzó a corregir queda en No
    cumple, y una ECR escalada o de nivel sistema que resuelvas con una decisión tuya queda en Pendiente de prueba, con la evidencia
    "Resuelta por integración (D-xx), sin verificación del cliente". Nunca declares Cumple una ECR que el cliente no dejó en Cumple,
    ni cambies el estado de una que el cliente dejó en Cumple. Agrega una columna con la iteración en que se cerró cada ECR. Si consideras necesario otro cambio, no lo apliques al diseño ni a los totales: regístralo
    en una tabla de cambios recomendados con las columnas parámetro, valor actual, valor recomendado, motivo y cálculo, como tarea
    pendiente para el diseñador.
    TRAZABILIDAD DEL CONCEPTO: Resume la cadena necesidades, requerimientos, matriz morfológica, ruta factible, evaluación y concepto
    seleccionado, y actualiza la matriz de diseño axiomático con los parámetros finales.]]
    [[ANALISIS: Escribe la parte del integrador del Dossier de Diseño Conceptual VDI 2206 de {system_type}. El resto del dossier lo genera
    el código desde el modelo (concepto, requerimientos y su cumplimiento, arquitectura, matriz de diseño, parámetros, BOM y
    presupuestos, decisiones, FMEA, cierre de ECR con el estado que dejó el cliente, supuestos, evidencia y comprobaciones): no lo
    copies. Escribe exactamente tres secciones con estos títulos de nivel 2. "## Resumen ejecutivo": el concepto, cómo cumple
    {primary_requirements} y el presupuesto {target_cost} según los totales del modelo, el estado de las ECR tal como lo dejó el
    cliente y lo que falta para aprobar el concepto; si alguna ECR queda en No cumple o Pendiente de prueba, no lo declares aprobado
    sin condiciones. "## Decisiones de integración": los conflictos entre dominios (dos informes con valores distintos para el mismo
    parámetro) y los presupuestos de sistema que resuelves, en una tabla con las columnas parámetro, valor original y disciplina que lo
    propuso, valor nuevo, motivo, cálculo que lo justifica e impacto en masa y costo; antes de cambiar un valor demuestra con un cálculo
    que el original no cumple o es inconsistente. Tus decisiones no cambian el modelo ni el estado de las ECR: una ECR escalada o de
    nivel sistema que resuelvas sigue en el estado que dejó el cliente y la resolución queda para el diseñador. Escribe Ninguna si no
    hay. "## Cambios recomendados": otros cambios que consideres necesarios, en una tabla con las columnas parámetro, valor actual,
    valor recomendado, motivo y cálculo, como tareas pendientes del diseñador. Escribe Ninguno si no hay.]]
    [[MODELO: Consulta el modelo para los totales y las comprobaciones automáticas; no registres cambios: tus decisiones quedan en el dossier.]]
    [[TABLAS:REGLA DE FORMATO: Resume la arquitectura global combinando los diagramas Mermaid clave de cada disciplina. Evita redundancias de texto introductorio.]]
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras. Prioriza el contenido esencial y no agregues anexos de relleno.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    [[TABLAS:El expediente final consolidado (Conceptual Design Dossier) completo en formato Markdown según la metodología VDI 2206,
    con la tabla de decisiones de integración, la tabla de cierre de ECR contra los criterios del cliente y un estado final coherente con ella.]]
    [[ANALISIS: Las tres secciones del integrador en Markdown: resumen ejecutivo, decisiones de integración y cambios recomendados.]]
  agent: team_lead

# --- Tareas del ciclo de corrección (las arma src/vdi/ciclo.py) ---
# [[MARCAS]] se reemplazan en el código antes de crear cada tarea; {variables} las interpola CrewAI.

ecr_triage_task:
  description: >
    Triaje de las solicitudes de cambio (ECR) del cliente para {system_type}, iteración [[ITERACION]] del ciclo de corrección. Lee el
    informe más reciente del cliente y la arquitectura de la síntesis del sistema. Para cada ECR que no esté en estado Cumple, decide qué
    disciplina debe corregirla y si se puede corregir con diseño. Disciplinas: requerimientos (tu informe de la Fase 1: necesidades,
    requerimientos, especificaciones y QFD etapa 1), sintesis (tu informe de síntesis: matriz morfológica, conceptos, evaluación de
    conceptos y QFD etapa 2), mecanica, electronica, software, rams o sistema. Los errores en tus propios informes los corriges tú
    como requerimientos o sintesis. Usa sistema solo si la corrección exige cambiar el concepto seleccionado o la arquitectura del
    producto: esas ECR no se corrigen en el ciclo y quedan para la integración final. Si una ECR toca dos disciplinas, asígnala a la
    que debe cambiar primero; la otra revisará el impacto. Asignación de la iteración anterior: [[TRIAJE_ANTERIOR]]. Mantén la misma
    disciplina para cada ECR salvo que la última verificación del cliente muestre que el cambio corresponde a otra; si la cambias,
    explica por qué en la justificación. Tipos: corregible (un cambio de diseño de la disciplina la resuelve), prueba (requiere medición, ensayo, prototipo o
    simulación que no se puede hacer en esta fase) o cotizacion (requiere una cotización formal). REGLA DE TIPO: si el criterio del
    cliente admite un cálculo como alternativa al ensayo, o si la ECR tiene una parte de diseño o de documentación que la disciplina
    puede hacer ahora, es corregible: la disciplina hace esa parte y el cliente dejará la ECR en Pendiente de prueba si solo falta el
    ensayo. Si esa parte ya se hizo y la última verificación del cliente indica que solo falta el ensayo o la cotización, es prueba o
    cotizacion. ECR escaladas, que ya fallaron dos
    veces y no debes marcar como corregibles: [[ESCALADAS]].
    [[MODELO: No registres en el modelo: la disciplina y el tipo los registra el código desde tu tabla. La vista trae la disciplina sugerida por el modelo para cada ECR (la dueña de los elementos que afecta): úsala como punto de partida.]]
    FORMATO OBLIGATORIO: una tabla Markdown con exactamente estas columnas y en este orden: | ECR | Disciplina | Tipo | Justificación |.
    En ECR escribe solo el identificador (por ejemplo ECR-03). En Disciplina escribe exactamente una de estas siete palabras, sin
    tildes ni variantes: requerimientos, sintesis, mecanica, electronica, software, rams, sistema (mantenimiento y confiabilidad se
    escriben rams). En Tipo
    escribe exactamente una de estas tres palabras: corregible, prueba, cotizacion. En Justificación, en una o dos frases, qué debe
    cambiar la disciplina y contra qué criterio del cliente. Ejemplo de la forma de una fila (no de su contenido):
      | ECR-03 | rams | corregible | Qué debe cambiar la disciplina y contra qué criterio del cliente. |
    Después de la tabla, una nota breve solo si hace falta.
    CIERRE OBLIGATORIO: termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    La tabla de triaje con una fila por ECR abierta: identificador, disciplina responsable, tipo y justificación.
  agent: team_lead

domain_correction_task:
  description: >
    Iteración [[ITERACION]] del ciclo de corrección para {system_type}. Eres responsable del dominio [[DOMINIO]] y debes corregir tu
    informe anterior para atender lo que te asignó el líder de integración:
    [[ECR_ASIGNADAS]]
    Cambios que otras disciplinas ya hicieron en esta iteración (tenlos en cuenta en tus interfaces):
    [[CAMBIOS_PREVIOS]]
    REGLA DE CORRECCIÓN: para cada ECR asignada, haz el cambio de diseño necesario con su cálculo, o demuestra con un cálculo que el
    valor original ya cumple el criterio de aceptación del cliente. No cambies el concepto seleccionado, el principio de solución ni
    la arquitectura; si una ECR lo exige (por ejemplo, si al corregir la evaluación de conceptos cambia el ganador), decláralo con el
    cálculo que lo demuestra y conserva el concepto actual. No cambies lo que no esté relacionado con lo asignado.
    [[MODELO: Registra en el modelo cada cambio de tu tabla de cambios, con la columna ECR en cada fila. Si el cambio toca un elemento de otra disciplina, el modelo lo rechaza: nómbralo en Impacto en otros dominios. Si la corrección cambia una elección de diseño, registra una decisión nueva con Reemplaza (la D-xx anterior) y Motivada por (la ECR); si una decisión vigente justifica un elemento que cambiaste y sigue valiendo, modifícala para dejarla al día.]]
    [[ANALISIS: Tu respuesta es tu análisis actualizado (sin copiar tablas de datos del modelo), con la sección de cambios que se pide a continuación: el código agrega los cambios registrados en el modelo.]]
    ENTREGA: el informe completo y actualizado de tu dominio, con la misma estructura que el anterior, que empiece con la sección
    "## Cambios de la iteración [[ITERACION]]" y en ella una tabla Markdown con las columnas | ECR | Parámetro | Valor anterior |
    Valor nuevo | Cálculo o justificación | Impacto en otros dominios |. En Impacto en otros dominios escribe solo ninguno si el cambio
    no afecta a otro dominio; si afecta, nombra cada dominio afectado con exactamente una de estas palabras, sin tildes ni variantes:
    requerimientos, sintesis, mecanica, electronica, software, rams, seguida de dos puntos y de qué cambia para él (masa, potencia,
    señal, tiempo, pesos de la evaluación), por ejemplo "electronica: cambia la corriente de la válvula; rams: cambia la masa". No nombres un dominio que no esté afectado. Si resuelves una ECR
    demostrando que el valor original cumple, regístrala con el mismo valor anterior y nuevo.[[TABLAS: Recalcula los totales afectados.]]
    EXTENSIÓN MÁXIMA: El informe completo no debe superar las {max_palabras} palabras.
    CIERRE OBLIGATORIO: Entrega el documento completo y termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    El informe completo y actualizado del dominio, que empieza con la tabla de cambios de la iteración.
  agent: mecanico

client_verification_task:
  description: >
    Iteración [[ITERACION]] del ciclo de corrección para {system_type}: verifica las correcciones de las disciplinas. ECR atendidas en
    esta iteración: [[ECR_ITERACION]]. Revisa los informes corregidos y sus tablas de cambios, y compara la evidencia de cada ECR
    atendida con tu criterio de aceptación literal. Si un cambio rompió algo que ya cumplía, o encuentras un problema nuevo en lo que se
    modificó, abre una ECR nueva con el siguiente número disponible y un criterio de aceptación verificable.
    [[MODELO: Registra en el modelo solo las ECR nuevas, con Afecta; los estados los registra el código desde tu tabla. Usa las comprobaciones automáticas de la vista: los avisos de trazabilidad nuevos van juntos en una sola ECR, como en la revisión inicial, y un aviso que ya cubre una ECR abierta no abre otra.]]
    FORMATO OBLIGATORIO: una tabla Markdown con todas las ECR que no estaban en estado Cumple antes de esta iteración más las nuevas, con
    exactamente estas columnas: | ECR | Criterio de aceptación | Estado | Evidencia |. El Estado solo puede ser Cumple, No cumple o
    Pendiente de prueba (requiere medición, ensayo, prototipo, simulación o cotización que no se ha hecho), escrito tal cual y sin
    calificativos (no escribas Cumple condicional ni Cumple parcialmente: si solo falta un ensayo o una cotización, es Pendiente de
    prueba; si la evidencia no alcanza el criterio, es No cumple). Para una ECR nueva escribe
    en Evidencia "Nueva" y el motivo. Después de la tabla, un dictamen breve.
    CIERRE OBLIGATORIO: termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    La tabla de verificación con el estado de cada ECR abierta y las ECR nuevas, y un dictamen breve.
  agent: cliente

# --- Informe para el ingeniero (F2; lo arma src/vdi/ciclo.py tras el dossier; VDI_INFORME_FINAL=0 lo apaga) ---

engineer_report_task:
  description: >
    Escribe el informe del diseño conceptual de {system_type} para el ingeniero que debe decidir si aprueba el concepto. Tu contexto
    son el dossier técnico (tablas generadas desde el modelo de diseño) y el historial del diseño. El código agrega después de cada
    sección los gráficos y las tablas (arquitectura, uso de cada límite, masa y costo por módulo, decisiones, modos de falla y
    pendientes): tú escribes solo la prosa que los explica, para una persona que no leyó los informes de las disciplinas.
    REGLAS: No escribas tablas, diagramas Mermaid ni bloques de código. Cita los identificadores del modelo (RF-01, M-02, CP-03, D-01,
    ECR-04, MF-02) cuando hables de un elemento. Usa solo cifras que estén en el dossier o en el historial, con su unidad; puedes
    redondearlas, pero no calcules cifras nuevas ni inventes datos. El estado de cada ECR es el que dejó el cliente: no declares
    aprobado ni cumplido lo que quedó en No cumple o Pendiente de prueba. Los precios son estimaciones del modelo, no cotizaciones.
    Explica el porqué de las decisiones, no repitas las tablas.
    ESTRUCTURA OBLIGATORIA: exactamente estas siete secciones, con estos títulos de nivel 2 y en este orden:
    "## Resumen ejecutivo" (máximo 200 palabras: qué se diseñó, si cumple lo esencial y qué falta para aprobarlo),
    "## Concepto y funcionamiento" (cómo funciona el sistema, de la necesidad al principio de solución, y cómo se reparte en módulos),
    "## Cumplimiento de los requerimientos" (los que cumplen con margen, los que quedan cerca del límite y los que aún no tienen un valor que los mida),
    "## Decisiones clave" (las decisiones que más pesan, qué alternativas se descartaron y por qué),
    "## Masa y costo" (dónde se concentran y qué margen queda frente a los límites),
    "## Riesgos" (los modos de falla más graves y las ECR que no cerraron, con su mitigación),
    "## Qué falta para aprobar" (ensayos, supuestos por confirmar y cotizaciones, en orden de importancia).
    EXTENSIÓN MÁXIMA: 1500 palabras en total.
    CIERRE OBLIGATORIO: termina SIEMPRE con la línea exacta <!-- FIN DEL INFORME --> como última línea, sin texto después.
  expected_output: >
    La prosa del informe para el ingeniero en Markdown, con las siete secciones pedidas, sin tablas ni diagramas, citando
    identificadores y solo cifras del dossier o del historial.
  agent: team_lead
